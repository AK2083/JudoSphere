name: Workflow
description: Propose an improvement to the development process
title: 'Workflow: '
body:
  - type: markdown
    attributes:
      value: |
        Use this template for process, tooling, and CI/CD improvements.
        Write the request as a **user story** and name the **target audience** in the "As a …" clause.
        The story covers who, what, and why — use the fields below only for current state and how to change it.

  - type: textarea
    id: user_story
    attributes:
      label: User Story
      description: Who benefits, what they need, and why. Always include the target audience.
      value: |
        As a [target audience, e.g. maintainer / contributor],
        I want [workflow improvement],
        so that [benefit].
      render: markdown
    validations:
      required: true

  - type: textarea
    id: current_state
    attributes:
      label: Current State
      description: How the process or tooling works today (facts, not restating the story).
      placeholder: e.g. Manual deployment steps are required; Action pins are updated ad hoc
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Concrete changes to make (steps, files, or approach).
      placeholder: e.g. Add a report-only ncu job and refresh SHA-pinned Actions in ci.yml
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Prerequisites, tooling, or access rights (optional).
      placeholder: e.g. Required secrets and environment access
