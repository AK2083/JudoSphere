name: Workflow
description: Propose an improvement to the development process
title: "Workflow: "
body:
  - type: markdown
    attributes:
      value: |
        Use this template for process, tooling, and CI/CD improvements.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is painful or inefficient in the current development process?
      placeholder: e.g. The deployment process is slow and error-prone
    validations:
      required: true

  - type: textarea
    id: current_state
    attributes:
      label: Current State
      description: How does the current workflow look?
      placeholder: e.g. Manual deployment steps are required
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should this improvement achieve?
      placeholder: e.g. Automate the deployment process
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What concrete improvements are proposed?
      placeholder: e.g. Implement a CI/CD pipeline with GitHub Actions
    validations:
      required: true

  - type: textarea
    id: benefits
    attributes:
      label: Benefits
      description: What benefits does this improvement bring?
      placeholder: e.g. Faster deployments, fewer manual errors
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Implementation
      description: How should the improvement be implemented? (optional)
      placeholder: e.g. Set up GitHub Actions workflow and environments

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Prerequisites, tooling, or access rights (optional).
      placeholder: e.g. Required secrets and environment access

  - type: textarea
    id: evaluation_criteria
    attributes:
      label: Evaluation Criteria
      description: How do we measure success?
      placeholder: e.g. Deployment time reduced by 50%
    validations:
      required: true

  - type: textarea
    id: effort
    attributes:
      label: Effort
      description: Expected effort (optional).
      placeholder: e.g. 3 days of work

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low
        - Medium
        - High
      default: 1
    validations:
      required: true
