name: Spike
description: Time-boxed research for unclear requirements
title: 'Spike: '
body:
  - type: markdown
    attributes:
      value: |
        Use spikes for time-boxed investigation.
        Write the spike as a **user story** and name the **target audience** in the "As a …" clause.
        The story covers who needs the answer and why — use the fields below for concrete questions, time box, and results.

  - type: textarea
    id: user_story
    attributes:
      label: User Story
      description: Who needs the answer, what they want to learn, and why. Always include the target audience.
      value: |
        As a [target audience, e.g. maintainer / product owner / contributor],
        I want [knowledge / recommendation from this spike],
        so that [decision or next step is unblocked].
      render: markdown
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Questions
      description: Specific questions this spike must answer (more concrete than the user story).
      placeholder: e.g. Is a Dev Container useful for our setup? What are the trade-offs vs. local toolchains?
    validations:
      required: true

  - type: textarea
    id: timeline
    attributes:
      label: Timeline
      description: Time box and milestones.
      placeholder: e.g. 2 days with a review after 1 day
    validations:
      required: true

  - type: textarea
    id: documentation
    attributes:
      label: References
      description: Relevant links or documents (optional).
      placeholder: e.g. Links to docs, RFCs, prior spikes

  - type: textarea
    id: results
    attributes:
      label: Results
      description: Fill in after the spike is complete.
      placeholder: e.g. Findings and recommendation
