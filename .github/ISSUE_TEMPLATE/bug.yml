name: Bug
description: Report a bug in the application
title: "Bug: "
type: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear and precise description of the bug.
      placeholder: e.g. The login button does not respond when clicked
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Reproduction Steps
      description: Step-by-step instructions to reproduce the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What should happen?
      placeholder: e.g. The user should be logged in
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: What happens instead?
      placeholder: e.g. Nothing happens when clicking the login button
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Where did you observe the bug?
      value: |
        - OS:
        - Browser:
        - App version:
      render: markdown
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: Attach screenshots or paste relevant log output. Tip - drag and drop files into this field.
      placeholder: Attach files or paste logs here

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is the impact?
      options:
        - Low
        - Medium
        - High
        - Critical
      default: 1
    validations:
      required: true

  - type: textarea
    id: additional_information
    attributes:
      label: Additional Information
      description: Related issues, context, or anything else that might help.
      placeholder: e.g. Related to #123
