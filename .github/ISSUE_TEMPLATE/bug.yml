name: Bug
description: Report a bug in the application
title: 'Bug: '
type: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.
        Write the report as a **user story** and name the **target audience** in the "As a …" clause.
        Put the expected behavior in "I want …"; use the fields below for what goes wrong and how to reproduce it.

  - type: textarea
    id: user_story
    attributes:
      label: User Story
      description: Who is affected, what should work, and why. Always include the target audience.
      value: |
        As a [target audience, e.g. scoring judge / tournament organizer / club admin],
        I want [expected working behavior],
        so that [benefit / outcome].
      render: markdown
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: What happens instead of the expected behavior in the user story?
      placeholder: e.g. Nothing happens when clicking the login button
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Reproduction Steps
      description: Step-by-step instructions to reproduce the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Where did you observe the bug?
      value: |
        - OS:
        - Browser:
        - App version:
      render: markdown
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is the impact?
      options:
        - Low
        - Medium
        - High
        - Critical
      default: 1
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: Attach screenshots or paste relevant log output (optional). Tip - drag and drop files into this field.
      placeholder: Attach files or paste logs here

  - type: textarea
    id: additional_information
    attributes:
      label: Additional Information
      description: Related issues, context, or anything else that might help (optional).
      placeholder: e.g. Related to #123
