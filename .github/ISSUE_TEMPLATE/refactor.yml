name: Refactor
description: Propose refactoring of existing code
title: 'Refactor: '
body:
  - type: markdown
    attributes:
      value: |
        Refactors should improve maintainability or performance without changing intended behavior unless explicitly stated.
        Write the request as a **user story** and name the **target audience** in the "As a …" clause.
        The story covers who, what, and why — use the fields below for today's code shape, the change, and impact.

  - type: textarea
    id: user_story
    attributes:
      label: User Story
      description: Who benefits, what they need, and why. Always include the target audience.
      value: |
        As a [target audience, e.g. contributor / maintainer],
        I want [clearer / safer / faster code area],
        so that [benefit].
      render: markdown
    validations:
      required: true

  - type: textarea
    id: current_state
    attributes:
      label: Current State
      description: What the code or system looks like today (facts, not restating the story).
      placeholder: e.g. Shared scoring logic is duplicated across three slices
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What concrete changes will be made?
      placeholder: e.g. Extract shared logic into a common module and simplify the hot path
    validations:
      required: true

  - type: textarea
    id: impacts
    attributes:
      label: Impacts
      description: Expected impact on functionality, performance, quality, and dependencies.
      value: |
        - Functionality:
        - Performance:
        - Code quality:
        - Dependencies:
      render: markdown
    validations:
      required: true
