name: Release Tauri Build

# Reusable macOS / Windows / Linux Tauri matrix used by Test, Staging, and Production
# release workflows. This workflow does **not** embed channel promotion (alpha → beta → rc);
# callers own SemVer identity, release notes, and whether a GitHub Release is created.
#
# Secrets (pass from the caller; typically Environment secrets):
#   TAURI_SIGNING_PRIVATE_KEY
#     Private key used by Tauri to sign update/installer artifacts. Clients with the
#     matching public key (later via @tauri-apps/plugin-updater) can verify that a
#     download really came from you. Without it, builds still work; Production
#     auto-updates are not trustworthy until this is configured.
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#     Only needed if that private key file is passphrase-protected.
#
# Publish behavior:
#   publish_release: false (default) → build only; upload workflow artifacts (no GitHub Release)
#   publish_release: true            → build and attach assets to tag `tag` (caller supplies metadata)

on:
  workflow_call:
    inputs:
      version:
        description: SemVer without build metadata (e.g. 1.0.0-alpha.1)
        required: true
        type: string
      version_name:
        description: Per-release designation entered manually (becomes VITE_APP_VERSION_NAME / Release name)
        required: true
        type: string
      tag:
        description: Full Git tag (e.g. v1.0.0-alpha.1+Example)
        required: true
        type: string
      environment:
        description: GitHub Environment name (test | staging | production)
        required: true
        type: string
      ref:
        description: Git ref to check out and build
        required: true
        type: string
      publish_release:
        description: When true, create/update a GitHub Release for `tag` and attach installers
        required: false
        type: boolean
        default: false
      prerelease:
        description: Mark the GitHub Release as prerelease (ignored unless publish_release is true)
        required: false
        type: boolean
        default: true
      release_body:
        description: GitHub Release body markdown (ignored unless publish_release is true)
        required: false
        type: string
        default: ''
      args:
        description: Extra args forwarded to `tauri build` / tauri-action
        required: false
        type: string
        default: ''
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        description: Private key that signs Tauri update/installer artifacts for updater verification
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        description: Passphrase if TAURI_SIGNING_PRIVATE_KEY is encrypted (omit when the key is unencrypted)
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.platform }}
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macos
          - platform: ubuntu-26.04
            label: linux
          - platform: windows-latest
            label: windows

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node.js 26 LTS (Lithium); check-latest picks the newest 26.x patch
          node-version: 26
          check-latest: true
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - name: Install Linux WebKit deps
        if: matrix.platform == 'ubuntu-26.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install npm dependencies
        run: npm ci

      - name: Sync release identity into manifests
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_VERSION_NAME: ${{ inputs.version_name }}
        run: node scripts/sync-release-identity.mjs

      - name: Build Tauri app (no GitHub Release)
        if: ${{ !inputs.publish_release }}
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_APP_VERSION_NAME: ${{ inputs.version_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ inputs.args }}

      - name: Upload build artifacts
        if: ${{ !inputs.publish_release }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: judosphere-${{ inputs.tag }}-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/dmg
            src-tauri/target/release/bundle/macos
            src-tauri/target/release/bundle/deb
            src-tauri/target/release/bundle/appimage
            src-tauri/target/release/bundle/rpm
            src-tauri/target/release/bundle/msi
            src-tauri/target/release/bundle/nsis
          if-no-files-found: warn
          retention-days: 14

      - name: Build Tauri app and publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_APP_VERSION_NAME: ${{ inputs.version_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: ${{ inputs.version_name }}
          releaseBody: ${{ inputs.release_body }}
          releaseDraft: false
          prerelease: ${{ inputs.prerelease }}
          args: ${{ inputs.args }}
