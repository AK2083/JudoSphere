<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JudoSphere</title>
    <!-- Early theme boot: key must match APP_PREFERENCES_STORAGE_KEY -->
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('judosphere.app.preferences')
          if (!raw) return
          var theme = JSON.parse(raw).theme
          var root = document.documentElement
          if (theme === 'light' || theme === 'dark') {
            root.setAttribute('data-color-scheme', theme)
          } else if (theme === 'system') {
            var dark =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            root.setAttribute('data-color-scheme', dark ? 'dark' : 'light')
          }
        } catch (_) {}
      })()
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
